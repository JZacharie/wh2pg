name: Publish Helm Chart to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Update Chart Version
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          if [ -z "$VERSION" ]; then
             VERSION="0.0.0-dev"
          fi
          sed -i "s/^version: .*/version: $VERSION/" helm/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" helm/Chart.yaml

      - name: Validate Helm Chart
        run: |
          helm lint helm/

      - name: Package Helm Chart
        run: |
          helm package helm/
          # Move package to a temporary location so it doesn't get lost during checkout
          mkdir -p /tmp/chart-output
          mv wh2pg-*.tgz /tmp/chart-output/

      - name: Checkout gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch all branches
          git fetch origin
          
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            echo "Checking out existing gh-pages branch"
            git checkout gh-pages
            git pull origin gh-pages
          else
            echo "Creating new orphan gh-pages branch"
            git checkout --orphan gh-pages
            git rm -rf .
            echo "# Helm Repository" > README.md
            git add README.md
            git commit -m "Initialize gh-pages"
            # Push immediately to establish the branch
            git push origin gh-pages
          fi

      - name: Update Helm Repository Index
        run: |
          # Copy new chart package from temp location
          cp /tmp/chart-output/wh2pg-*.tgz .
          
          # Generate/update index
          if [ -f index.yaml ]; then
            echo "Updating existing index.yaml"
            helm repo index . --url https://jzacharie.github.io/wh2pg --merge index.yaml
          else
            echo "Creating new index.yaml"
            helm repo index . --url https://jzacharie.github.io/wh2pg
          fi
          
          # Show what we're publishing
          echo "=== Repository Contents ==="
          ls -lh *.tgz
          echo ""
          echo "=== Index.yaml ==="
          cat index.yaml

      - name: Commit and Push to gh-pages
        run: |
          git add .
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish Helm chart ${{ steps.get_version.outputs.VERSION }}"
            
            # Pull with rebase before pushing to handle any concurrent updates
            git pull --rebase origin gh-pages
            git push origin gh-pages
            
            echo "✅ Helm chart published to GitHub Pages"
            echo "🌐 Repository URL: https://jzacharie.github.io/wh2pg"
          fi
